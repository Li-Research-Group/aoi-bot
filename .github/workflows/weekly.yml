name: Weekly articles of interest (AOI) digest

on:
  schedule:
    # Runs every Monday at 12:00 UTC. Adjust the cron to land 1-2 days
    # before your group meeting -- see README for how to convert to your
    # local timezone.
    - cron: "0 12 * * 1"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # needed to commit the updated state file back

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run weekly digest
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run_weekly.py

      - name: Commit updated state
        run: |
          git config user.name "aoi-bot"
          git config user.email "actions@github.com"
          git add state/paper_log.json
          git diff --staged --quiet || git commit -m "Update paper log [skip ci]"
          git push
